[project]
name = "adsb-solution"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.3.0",
    "natasha>=1.6.0",
    "nbconvert>=7.17.1",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "setuptools<81",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260914",
    "ruff>=0.16.9",
    "scipy-stubs>=1.17.1.5",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "NPY", "ERA"]

[tool.ruff.lint.isort]
known-first-party = ["eval", "baseline", "check_no_comments"]

[tool.mypy]
strict = true
mypy_path = ["src", "scripts"]
files = ["src", "scripts", "tests"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "tqdm.*", "pyarrow.*", "natasha.*"]
ignore_missing_imports = true
