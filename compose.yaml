services:
  download-model:
    image: python:3.12-slim
    container_name: nk-model-downloader
    volumes:
      - llama-models:/models
    environment:
      HF_TOKEN: ${HF_TOKEN}
      HF_XET_HIGH_PERFORMANCE: "1"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        pip install -q -U huggingface_hub
        hf download unsloth/gemma-4-12B-it-qat-GGUF gemma-4-12B-it-qat-UD-Q4_K_XL.gguf --local-dir /models --token "$$HF_TOKEN"
        hf download unsloth/gemma-4-12B-it-qat-GGUF mtp-gemma-4-12B-it.gguf --local-dir /models --token "$$HF_TOKEN"
    profiles:
      - download

  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: nk-llama
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - llama-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      --model /models/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
      --model-draft /models/mtp-gemma-4-12B-it.gguf
      --n-gpu-layers-draft 99
      --spec-draft-n-max 8
      --host 0.0.0.0
      --port 8080
      --ctx-size 32768
      --n-gpu-layers 99
      --threads 16
      --parallel 8
      --jinja
      --reasoning-budget 0
      --seed 20260922
      --temp 0

volumes:
  llama-models:
    name: llama-models